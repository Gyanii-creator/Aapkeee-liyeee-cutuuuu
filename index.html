<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Meraaa Aashuuu 💖</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Loading Screen -->
<div id="loader">
    <div class="loader-heart">💗</div>
    <p>Preparing something special...</p>
</div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Main Container -->
<div id="app" class="hidden">

    <!-- Name Gate -->
    <div class="card" id="nameScreen">
        <h1>Hey… 🌸</h1>
        <p>This is only for one person.</p>
        <input type="text" id="nameInput" placeholder="Enter your name">
        <button onclick="checkName()">Unlock 💌</button>
        <p id="error"></p>
    </div>

    <!-- Welcome -->
    <div class="card hidden" id="welcomeScreen">
        <h1>Heloooo Aashiieeeeeeeeeeebeeaaaaaaa ✨</h1>
        <p>I made this… just to make you smilewwwwwww.</p>
        <button onclick="startQuestions()">Start 🌷</button>
    </div>

    <!-- Questions -->
    <div class="card hidden" id="questionScreen">
        <div class="progress">
            <div id="progressBar"></div>
        </div>
        <h2 id="questionText"></h2>
        <div class="buttons">
            <button onclick="nextQuestion()">Yes 💕</button>
            <button id="noBtn">No 😢</button>
        </div>
    </div>

    <!-- Final -->
    <div class="card hidden" id="finalScreen">
        <h1 class="heartbeat">You Matter To Me 💖</h1>
        <p>
            Thank you for being part of my days.<br>
            Thank you for staying.<br>
            Thank you for being you.
        </p>

        <h2 class="loveText">I love youuu Aasheeeee 💕</h2>

        <button onclick="restart()">Replay 🌸</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
